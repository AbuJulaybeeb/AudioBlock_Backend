services:
  backend:
    container_name: audioblocks-backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '4000:4000'
    env_file: .env.docker
    environment:
      - NODE_ENV=development
    depends_on:
      - db
      - redis
      # RabbitMQ is optional for the minimal stack (API + DB + Redis). The
      # backend starts without it and connects lazily; `docker compose up`
      # (no profile) therefore omits rabbitmq. Use `--profile full` or
      # `--profile queue` to include it.
    volumes:
      - .:/app
      - /app/node_modules
      - ./uploads:/app/uploads
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:4000/health/live', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  indexer:
    container_name: audioblocks-indexer
    build:
      context: .
      dockerfile: Dockerfile
    command: ['npm', 'run', 'worker:indexer']
    restart: unless-stopped
    env_file: .env.docker
    environment:
      INDEXER_METRICS_PORT: 9464
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - full
      - indexer
      - monitoring
      - observability

  db:
    container_name: audioblocks-db
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: audioblocks
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis-server
    ports:
      - '6379:6379'
    restart: always
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: always
    ports:
      - '5050:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    profiles:
      - full
      - tools
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    profiles:
      - full
      - queue
      - messaging

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - '9090:9090'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    profiles:
      - full
      - monitoring
      - observability

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - '3000:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: ''
    volumes:
      - ./monitoring/grafana/provisioning.yml:/etc/grafana/provisioning/provisioning.yml:ro
      - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    profiles:
      - full
      - monitoring
      - observability

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: always
    ports:
      - '3100:3100'
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    profiles:
      - full
      - monitoring
      - observability

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: always
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail.yml
    depends_on:
      - loki
    profiles:
      - full
      - monitoring
      - observability

volumes:
  pgdata:
  redisdata:
  pgadmin_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  loki_data:
