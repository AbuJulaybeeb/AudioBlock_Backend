openapi: 3.0.3
info:
  title: AudioBlocks Backend API Reference
  version: 1.0.0
  description: API reference for AudioBlocks music NFT platform on Stellar/Soroban.
paths:
  /api/api-keys:
    post:
      summary: Create an API key
      description: Issues a new API key with explicit scopes (read-only, upload, admin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string
                    enum: [read-only, upload, admin]
      responses:
        '201':
          description: API key created successfully.
    get:
      summary: List API keys
      description: Returns the list of API keys for the authenticated user.
  /api/api-keys/{id}:
    delete:
      summary: Revoke an API key
      description: Revokes an active API key.

  /api/activity/onchain:
    get:
      summary: List indexed on-chain activity
      description: Queries indexed on-chain events from Soroban contracts with pagination and filtering by contractType, eventType, and address.
      parameters:
        - name: contractType
          in: query
          required: false
          description: Filter events by smart contract type (e.g. nft, artist, catalog, royalty, marketplace).
          schema:
            type: string
        - name: eventType
          in: query
          required: false
          description: Filter events by event name/type (e.g. mint, transfer, royalty_payout, sale, list, setup).
          schema:
            type: string
        - name: address
          in: query
          required: false
          description: Filter events by wallet or contract address (e.g. Stellar public key).
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: 1-based page number for pagination.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Number of items per page (maximum 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A paginated list of indexed on-chain events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IndexedEvent'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
  /api/song:
    get:
      summary: List songs
      description: Filtered, paginated song listing. Public callers only receive ready, unflagged songs. An artist listing their own songs (artistId equal to the caller) receives every status and may filter by status.
      parameters:
        - name: artistId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: genreId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: tag
          in: query
          required: false
          description: Tag slug.
          schema:
            type: string
        - name: mintStatus
          in: query
          required: false
          schema:
            type: string
            enum: [not_minted, pending, minted, failed]
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [newest, popular, title]
            default: newest
        - name: status
          in: query
          required: false
          description: Owner only. Returns 403 when artistId is not the caller.
          schema:
            type: string
            enum: [processing, ready, failed]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A paginated list of songs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Song'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          description: Invalid query parameter.
        '403':
          description: The status filter was used on songs the caller does not own.
  /api/song/{id}:
    get:
      summary: Get a song
      description: Returns one song. Flagged, taken-down and not-ready songs return 404 unless the caller is the owning artist, who also receives errorReason. Supports ETag and If-None-Match.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The song.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Song'
        '304':
          description: Not modified.
        '400':
          description: The id is not a UUID.
        '404':
          description: Song not found or not visible to the caller.
components:
  schemas:
    Song:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        artist:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            username:
              type: string
              nullable: true
            name:
              type: string
              nullable: true
            profileImage:
              type: string
              nullable: true
        cover:
          type: object
          properties:
            path:
              type: string
            thumbnails:
              type: object
              nullable: true
              additionalProperties:
                type: string
        genre:
          type: string
          nullable: true
        genreId:
          type: string
          nullable: true
        duration:
          type: integer
          nullable: true
        playCount:
          type: integer
        status:
          type: string
          enum: [processing, ready, failed]
        mintStatus:
          type: string
          enum: [not_minted, pending, minted, failed]
        onChainSongId:
          type: string
          nullable: true
        onChainTokenId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        errorReason:
          type: string
          nullable: true
          description: Only present for the owning artist.
    IndexedEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        contractType:
          type: string
          nullable: true
          example: marketplace
        contractId:
          type: string
          nullable: true
          example: CA...
        eventType:
          type: string
          example: sale
        address:
          type: string
          nullable: true
          example: GBXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
        txHash:
          type: string
          nullable: true
          example: a1b2c3d4e5f6...
        ledger:
          type: integer
          nullable: true
          example: 123456
        data:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 42
        totalPages:
          type: integer
          example: 3
