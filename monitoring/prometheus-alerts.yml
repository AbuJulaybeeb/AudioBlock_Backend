# Prometheus alerting rules for the AudioBlock indexer (Issue #240).
#
# The indexer exposes `indexer_lag_ledgers` — the difference between the
# current Stellar ledger tip and the last ledger the worker indexed, per
# network/contract. These rules fire when that lag is sustained past a
# threshold, indicating the worker has stalled (RPC outage, crash loop, etc.).
#
# Runbook: https://github.com/AudioBitsStellar/AudioBlock_Backend/blob/main/docs/indexer-backfill-runbook.md
groups:
  - name: audioblock-indexer
    rules:
      - alert: IndexerLagMetricsMissing
        expr: absent(indexer_lag_ledgers)
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: 'Indexer lag metrics are missing'
          description: >
            Prometheus has not received indexer lag metrics for 10 minutes.
            Check that the indexer worker is running and its metrics endpoint is reachable.
          runbook: 'https://github.com/AudioBitsStellar/AudioBlock_Backend/blob/main/docs/indexer-backfill-runbook.md'

      # Fires when any contract has been lagging behind the tip for 15+ minutes.
      # Threshold (INDEXER_LAG_ALERT_THRESHOLD_LEDGERS) defaults to 1000 ledgers.
      - alert: HighIndexerLag
        expr: |
          indexer_lag_ledgers > 1000
        for: 15m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: 'Indexer is lagging for {{ $labels.contract }} on {{ $labels.network }}'
          description: >
            The indexer worker has been {{ $value }} ledgers behind the current
            tip for {{ $labels.contract }} on {{ $labels.network }} for over 15
            minutes. The worker may have stalled (RPC outage or crash loop).
          runbook: 'https://github.com/AudioBitsStellar/AudioBlock_Backend/blob/main/docs/indexer-backfill-runbook.md'
          dashboard: 'http://localhost:3001/d/audioblock-indexer'

      # Escalates a critical warning if a contract falls far behind the tip.
      - alert: CriticalIndexerLag
        expr: |
          indexer_lag_ledgers > 10000
        for: 30m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: 'Indexer critically behind for {{ $labels.contract }} on {{ $labels.network }}'
          description: >
            {{ $labels.contract }} on {{ $labels.network }} is {{ $value }} ledgers
            behind the tip and needs immediate attention.
          runbook: "https://github.com/AudioBitsStellar/AudioBlock_Backend/blob/main/docs/indexer-backfill-runbook.md"
          dashboard: "http://localhost:3001/d/audioblock-indexer"

  # Authentication failure monitoring (Issue #631)
  - name: audioblock-auth
    rules:
      # Fires when authentication failure rate is high
      - alert: HighAuthenticationFailureRate
        expr: |
          rate(auth_failures_total[5m]) > 10
        for: 10m
        labels:
        severity: warning
          team: backend
        annotations:
          summary: "High authentication failure rate detected"
          description: >
            Authentication failures are occurring at {{ $value | humanize }} per second
            for auth_method={{ $labels.auth_method }}, failure_type={{ $labels.failure_type }}.
            This could indicate credential stuffing, expired tokens, or a service issue.
          dashboard: "http://localhost:3001/d/audioblock-app"

      # Fires when Privy circuit breaker opens (Issue #635)
      - alert: PrivyCircuitBreakerOpen
        expr: |
          privy_circuit_state{state="open"} == 1
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Privy circuit breaker is open"
          description: >
            The Privy authentication service circuit breaker has been open for over 5 minutes.
            Privy authentication is degraded and serving stale keys if available.
          dashboard: "http://localhost:3001/d/audioblock-app"

      # Fires when Privy is serving stale keys frequently (Issue #634)
      - alert: PrivyServingStaleKeys
        expr: |
          rate(privy_jwk_fetches_total{outcome="stale_served"}[5m]) > 0
        for: 15m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Privy is serving stale signing keys"
          description: >
            Privy JWKS refreshes have been failing and stale keys are being served.
            This indicates Privy API connectivity issues.
          dashboard: "http://localhost:3001/d/audioblock-app"

      # Fires when session revocations spike (Issue #625)
      - alert: HighSessionRevocationRate
        expr: |
          rate(privy_token_verifications_total{outcome="revoked"}[5m]) > 5
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High rate of revoked session attempts"
          description: >
            {{ $value | humanize }} revoked sessions per second are being rejected.
            This could indicate users attempting to reuse revoked tokens or a session management issue.
          dashboard: "http://localhost:3001/d/audioblock-app"

  # RabbitMQ queue backlog monitoring (Issue #377)
  - name: audioblock-rabbitmq
    rules:
      # Fires when song_processing queue backs up for 5+ minutes (worker crash, ffmpeg unavailable, etc.)
      - alert: SongProcessingQueueBacklog
        expr: |
          rabbitmq_queue_depth{queue="song_processing"} > 10
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "RabbitMQ song_processing queue backlog detected"
          description: >
            The song_processing queue has had {{ $value }} pending messages for over 5 minutes.
            Song workers may have stalled, crashed, or encountered processing failures.
          runbook: "https://github.com/AudioBitsStellar/AudioBlock_Backend/blob/main/docs/worker-scaling.md"
          dashboard: "http://localhost:3001/d/audioblock-app"

      # Escalates to critical when backlog is sustained at high levels
      - alert: CriticalSongProcessingQueueBacklog
        expr: |
          rabbitmq_queue_depth{queue="song_processing"} > 50
        for: 10m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Critical backlog on RabbitMQ song_processing queue"
          description: >
            The song_processing queue has exceeded 50 pending messages for over 10 minutes (current: {{ $value }}).
            Immediate worker restart or scaling intervention required.
          runbook: "https://github.com/AudioBitsStellar/AudioBlock_Backend/blob/main/docs/worker-scaling.md"
          dashboard: "http://localhost:3001/d/audioblock-app"

